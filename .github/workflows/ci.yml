name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Unit tests
        run: npm test

      - name: web-ext lint
        run: npm run lint

      - name: Build unsigned package
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: passforge-unsigned
          path: web-ext-artifacts/*.zip
          if-no-files-found: error
